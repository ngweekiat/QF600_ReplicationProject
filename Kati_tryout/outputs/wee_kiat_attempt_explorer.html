nchmark-relative references.", "category": "active", "url": "https://github.com/ngweekiat/QF600_ReplicationProject/blob/wee-kiat-attempt/scripts/12_active_pfml.py"}, {"file": "13_breadth.py", "title": "Universe breadth", "description": "Compare portfolio capacity and performance as the investable universe expands.", "category": "capacity", "url": "https://github.com/ngweekiat/QF600_ReplicationProject/blob/wee-kiat-attempt/scripts/13_breadth.py"}, {"file": "14_halflife.py", "title": "Half-life test", "description": "Test whether changing the trading or signal half-life improves realised outcomes.", "category": "iteration", "url": "https://github.com/ngweekiat/QF600_ReplicationProject/blob/wee-kiat-attempt/scripts/14_halflife.py"}, {"file": "15_holdout.py", "title": "Holdout evaluation", "description": "Run the frozen strategy on the post-publication holdout period.", "category": "holdout", "url": "https://github.com/ngweekiat/QF600_ReplicationProject/blob/wee-kiat-attempt/scripts/15_holdout.py"}, {"file": "16_macro_stress.py", "title": "Macro stress tests", "description": "Re-cost and classify portfolios under rates, VIX and recession scenarios.", "category": "stress", "url": "https://github.com/ngweekiat/QF600_ReplicationProject/blob/wee-kiat-attempt/scripts/16_macro_stress.py"}, {"file": "17_report_figures.py", "title": "Report figures", "description": "Assemble paper replication, frontier, iteration, stress and appendix figures.", "category": "report", "url": "https://github.com/ngweekiat/QF600_ReplicationProject/blob/wee-kiat-attempt/scripts/17_report_figures.py"}]},$=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
